<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container login-container">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill display-1 text-primary"></i>
            <h2 class="fw-bold mt-2">Accesso Riservato</h2>
        </div>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> Credenziali errate.</div>
                <div th:if="${param.logout}" class="alert alert-success py-2"><i class="bi bi-check-circle"></i> Disconnessione completata.</div>
                
                <form th:action="@{/login}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" required />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" name="password" required />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold fs-5">Entra nel Pannello</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3"><a th:href="@{/}" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Torna al sito pubblico</a></div>
    </div>
</body>
</html>
