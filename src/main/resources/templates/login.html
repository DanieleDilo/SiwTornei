<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SIW Tornei</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4;}
        .login-box { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold;}
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Accesso Amministratore</h2>
        
        <div th:if="${param.error}" class="error">
            Username o password errati.
        </div>

        <div th:if="${param.logout}" style="color: green; margin-bottom: 15px;">
            Sei uscito correttamente.
        </div>

        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required />
            </div>
            <button type="submit">Entra</button>
        </form>
        
        <br>
        <a th:href="@{/}">Torna alla Home</a>
    </div>

</body>
</html>
