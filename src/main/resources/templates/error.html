<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Errore - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error-card {
            max-width: 550px;
            margin: 80px auto;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #dc3545, #fd7e14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <div class="card error-card text-center p-4">
            <div class="card-body">
                <div class="error-code mb-3" th:text="${status} ?: 'Errore'">500</div>
                <h3 class="fw-bold text-dark mb-3" th:text="${error} ?: 'Qualcosa è andato storto'">Si è verificato un errore</h3>
                <p class="text-muted mb-4" th:text="${message} ?: 'La risorsa che stai cercando potrebbe essere stata rimossa, aver cambiato nome o essere temporaneamente non disponibile.'">
                    Dettagli dell'errore non disponibili.
                </p>
                
                <div class="bg-light p-3 rounded mb-4 text-start font-monospace small" th:if="${path}">
                    <strong>Percorso:</strong> <span th:text="${path}">/url-richiesto</span>
                </div>

                <a th:href="@{/}" class="btn btn-primary fw-bold py-2 px-4 shadow">
                    <i class="bi bi-house-door-fill me-2"></i> Torna alla Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
