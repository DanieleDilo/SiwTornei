<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendario Partite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4 fw-bold text-danger"><i class="bi bi-calendar-event"></i> Calendario e Risultati</h2>
        
        <div class="row g-4" th:if="${partite != null and !partite.isEmpty()}">
            <div class="col-md-6" th:each="partita : ${partite}">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span th:text="${partita.torneo.nome}">Torneo</span>
                        <span th:if="${partita.stato.name() == 'PLAYED'}" class="badge bg-success">Conclusa</span>
                        <span th:if="${partita.stato.name() == 'SCHEDULED'}" class="badge bg-warning text-dark">In Programma</span>
                    </div>
                    <div class="card-body text-center p-4">
                        <p class="text-muted small mb-3"><i class="bi bi-clock"></i> <span th:text="${partita.dataOra}">Data</span> | <i class="bi bi-geo-alt"></i> <span th:text="${partita.luogo}">Stadio</span></p>
                        
                        <div class="d-flex justify-content-center align-items-center gap-4">
                            <h4 class="fw-bold mb-0" style="width: 40%; text-align: right;" th:text="${partita.squadraCasa.nome}">Casa</h4>
                            
                            <div th:if="${partita.stato.name() == 'PLAYED'}" class="bg-light border rounded px-3 py-2 fs-4 fw-bold text-danger">
                                <span th:text="${partita.goalsHome}">0</span> - <span th:text="${partita.goalsAway}">0</span>
                            </div>
                            <div th:if="${partita.stato.name() == 'SCHEDULED'}" class="bg-light border rounded px-3 py-2 fs-5 text-muted fw-bold">VS</div>
                            
                            <h4 class="fw-bold mb-0" style="width: 40%; text-align: left;" th:text="${partita.squadraTrasferta.nome}">Trasferta</h4>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 text-center pb-3">
                        <a th:href="@{'/admin/partita/' + ${partita.id} + '/risultato'}" class="btn btn-sm btn-outline-danger w-100">
                            <i class="bi bi-pencil-square"></i> Inserisci/Modifica Risultato (Admin)
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:unless="${partite != null and !partite.isEmpty()}" class="alert alert-info shadow-sm mt-4">
            <i class="bi bi-info-circle"></i> Non ci sono partite in calendario al momento.
        </div>
        <div class="mt-4"><a th:href="@{/}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Torna alla Home</a></div>
    </div>
</body>
</html>
