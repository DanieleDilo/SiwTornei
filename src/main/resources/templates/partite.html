<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendario Partite - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <a th:href="@{/}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna alla Home
        </a>

        <h2 class="mb-4 fw-bold text-danger"><i class="bi bi-calendar-event"></i> Calendario e Risultati</h2>

        <div class="row g-4" th:if="${partite != null and !partite.isEmpty()}">
            <div class="col-md-6" th:each="partita : ${partite}">
                <div class="card shadow-sm border-0 h-100 transition-hover">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold" th:text="${partita.torneo.nome}">Torneo</span>
                        <span th:if="${partita.stato.name() == 'PLAYED'}" class="badge bg-success">Conclusa</span>
                        <span th:if="${partita.stato.name() == 'SCHEDULED'}" class="badge bg-warning text-dark">In
                            Programma</span>
                    </div>
                    <div class="card-body text-center p-4">
                        <p class="text-muted small mb-3">
                            <i class="bi bi-clock"></i> <span th:text="${partita.dataOra}">Data</span> |
                            <i class="bi bi-geo-alt"></i> <span th:text="${partita.luogo}">Stadio</span> |
                            <i class="bi bi-person-badge"></i> Arb: <span th:text="${partita.arbitro.cognome}">Arbitro</span>
                        </p>
                        <div class="d-flex justify-content-center align-items-center gap-4">
                            <h4 class="fw-bold mb-0" style="width: 40%; text-align: right;"
                                th:text="${partita.squadraCasa.nome}">Casa</h4>

                            <div th:if="${partita.stato.name() == 'PLAYED'}"
                                class="bg-light border rounded px-3 py-2 fs-4 fw-bold text-danger">
                                <span th:text="${partita.goalsHome}">0</span> - <span
                                    th:text="${partita.goalsAway}">0</span>
                            </div>
                            <div th:if="${partita.stato.name() == 'SCHEDULED'}"
                                class="bg-light border rounded px-3 py-2 fs-5 text-muted fw-bold">VS</div>

                            <h4 class="fw-bold mb-0" style="width: 40%; text-align: left;"
                                th:text="${partita.squadraTrasferta.nome}">Trasferta</h4>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 d-flex flex-column gap-2 pb-3">
                        <a th:href="@{'/partita/' + ${partita.id}}"
                            class="btn btn-sm btn-outline-secondary w-100">
                            <i class="bi bi-info-circle"></i> Dettaglio & Commenti
                        </a>
                        <div class="d-flex gap-2 w-100" sec:authorize="hasAuthority('ADMIN')">
                            <a th:href="@{'/admin/partita/' + ${partita.id} + '/risultato'}"
                                class="btn btn-sm btn-outline-primary w-100">
                                <i class="bi bi-pencil-square"></i> Risultato
                            </a>
                            <form th:action="@{'/admin/partita/' + ${partita.id} + '/delete'}" method="POST"
                                onsubmit="return confirm('Vuoi annullare ed eliminare questa partita?');" class="w-100 m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-trash"></i> Elimina
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
