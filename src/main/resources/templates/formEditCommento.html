<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Commento - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <a th:href="@{/partita/{id}(id=${commento.partita.id})}" class="btn btn-link text-decoration-none mb-3 p-0">
            <i class="bi bi-arrow-left"></i> Torna alla partita
        </a>

        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-pencil-square"></i> Modifica Commento</h4>

                <form th:action="@{/commento/{id}/edit(id=${commento.id})}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Il tuo commento</label>
                        <textarea name="testo" class="form-control" rows="4" required maxlength="1000"
                                  th:text="${commento.testo}"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="bi bi-check-lg"></i> Salva Modifiche
                        </button>
                        <a th:href="@{/partita/{id}(id=${commento.partita.id})}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
