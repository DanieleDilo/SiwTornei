<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elenco Tornei - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <a th:href="@{/}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna alla Home
        </a>

        <div class="row g-4">
            <!-- Sidebar Panel: Search & Controls -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px; z-index: 10;">
                    <div class="card-body p-4">
                        <h4 class="fw-bold text-white mb-3"><i class="bi bi-funnel-fill"></i> Filtra Tornei</h4>
                        
                        <form th:action="@{/torneo}" method="get" class="mb-4">
                            <div class="mb-3">
                                <label class="form-label">Nome Torneo</label>
                                <input type="text" name="nome" class="form-control" placeholder="Cerca per nome..."
                                    th:value="${nomeRicerca}">
                            </div>
                            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Cerca</button>
                        </form>
                        
                        <div sec:authorize="hasAuthority('ADMIN')" class="border-top pt-4 mt-3">
                            <h5 class="fw-bold text-warning mb-3"><i class="bi bi-gear-fill"></i> Azioni Admin</h5>
                            <a th:href="@{/admin/formNewTorneo}" class="btn btn-success w-100 shadow-sm">
                                <i class="bi bi-plus-circle"></i> Nuovo Torneo
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content Area: Tournaments Grid -->
            <div class="col-lg-8">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h2 class="fw-bold text-primary mb-0"><i class="bi bi-trophy-fill"></i> Tornei Disponibili</h2>
                </div>

                <div class="row g-4" th:if="${tornei != null and !tornei.isEmpty()}">
                    <div class="col-md-6" th:each="torneo : ${tornei}">
                        <div class="card h-100 shadow-sm border-0 transition-hover">
                            <div class="card-body text-center py-4 d-flex flex-column justify-content-between">
                                <div>
                                    <div class="mb-3">
                                        <i class="bi bi-award-fill display-4 text-warning"></i>
                                    </div>
                                    <h4 class="card-title fw-bold text-white" th:text="${torneo.nome}">Nome Torneo</h4>
                                    <p class="text-muted mb-2"><i class="bi bi-calendar"></i> Edizione <span th:text="${torneo.anno}">Anno</span></p>
                                    <p class="card-text text-secondary small mb-4"
                                        th:if="${torneo.descrizione != null and !torneo.descrizione.isEmpty()}"
                                        th:text="${torneo.descrizione}">Descrizione Torneo</p>
                                </div>
                                <a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-outline-primary w-100 fw-bold">
                                    Vai al Torneo <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:unless="${tornei != null and !tornei.isEmpty()}" class="alert alert-info shadow-sm mt-2">
                    <i class="bi bi-info-circle"></i> Nessun torneo disponibile al momento. Tornate a trovarci presto!
                </div>
            </div>
        </div>

    </div>
</body>

</html>
