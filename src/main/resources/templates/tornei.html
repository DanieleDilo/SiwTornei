<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista Tornei - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white p-3">
                <h2 class="mb-0 text-primary fw-bold"><i class="bi bi-list-ul"></i> Tornei Disponibili</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive" th:if="${tornei != null and !tornei.isEmpty()}">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome Torneo</th>
                                <th>Edizione (Anno)</th>
                                <th class="text-end">Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="torneo : ${tornei}">
                                <td class="fw-bold" th:text="${torneo.nome}">Nome</td>
                                <td th:text="${torneo.anno}">2024</td>
                                <td class="text-end">
                                    <a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> Dettagli
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:unless="${tornei != null and !tornei.isEmpty()}" class="text-center p-5">
                    <p class="text-muted">Nessun torneo disponibile al momento.</p>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Torna alla Home</a>
        </div>
    </div>
</body>
</html>
