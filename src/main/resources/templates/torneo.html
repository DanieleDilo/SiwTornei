<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettaglio Torneo - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container" th:if="${torneo != null}">
        <a th:href="@{/torneo}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna ai Tornei
        </a>

        <!-- Full-width Tournament Header Banner -->
        <div class="card shadow-sm border-0 mb-4 bg-primary text-white">
            <div class="card-body p-4 p-md-5 d-flex flex-column flex-md-row justify-content-between align-items-center gap-4">
                <div class="d-flex align-items-center gap-4 text-center text-md-start flex-column flex-md-row">
                    <div class="p-3 bg-white bg-opacity-10 rounded-circle">
                        <i class="bi bi-award-fill display-2 text-warning"></i>
                    </div>
                    <div>
                        <h1 class="fw-bold text-white mb-1 display-4" th:text="${torneo.nome}">Nome Torneo</h1>
                        <p class="mb-0 fs-5 opacity-90">
                            <i class="bi bi-calendar"></i> Edizione: <span th:text="${torneo.anno}">2024</span>
                            <span th:if="${torneo.descrizione != null and !torneo.descrizione.isEmpty()}" class="d-block d-md-inline ms-0 ms-md-3 mt-2 mt-md-0 fs-6 opacity-75">
                                <i class="bi bi-info-circle-fill"></i> <span th:text="${torneo.descrizione}">Descrizione Torneo</span>
                            </span>
                        </p>
                    </div>
                </div>
                
                <!-- Admin Operations inline button bar -->
                <div sec:authorize="hasAuthority('ADMIN')" class="d-flex flex-wrap gap-2 justify-content-center">
                    <a th:href="@{'/admin/torneo/' + ${torneo.id} + '/edit'}" class="btn btn-outline-light px-3 py-2">
                         <i class="bi bi-pencil-square"></i> Modifica Dettagli
                    </a>
                    <a th:href="@{'/admin/torneo/' + ${torneo.id} + '/squadre'}" class="btn btn-warning px-3 py-2">
                         <i class="bi bi-plus-circle-fill"></i> Gestisci Iscrizioni
                    </a>
                    <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/delete'}" method="POST" 
                          onsubmit="return confirm('Sei sicuro di voler eliminare definitivamente questo torneo?');" class="m-0">
                        <button type="submit" class="btn btn-danger px-3 py-2">
                            <i class="bi bi-trash3-fill"></i> Elimina Torneo
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Full-width Standings Section -->
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-white p-3">
                <h4 class="mb-0 fw-bold text-success"><i class="bi bi-list-ol"></i> Classifica del Torneo</h4>
            </div>
            
            <div class="table-responsive" th:if="${classifica != null and !classifica.isEmpty()}">
                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th class="text-start">Squadra</th>
                            <th>Pt</th>
                            <th>G</th>
                            <th>V</th>
                            <th>P</th>
                            <th>S</th>
                            <th>GF</th>
                            <th>GS</th>
                            <th>DR</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="riga, iterStat : ${classifica}">
                            <td class="fw-bold text-muted" th:text="${iterStat.count}">1</td>
                            <td class="text-start fw-bold text-primary">
                                <a th:href="@{'/squadra/' + ${riga.squadra.id}(from='torneo', refId=${torneo.id})}" class="text-decoration-none" th:text="${riga.squadra.nome}">Nome</a>
                            </td>
                            <td class="fw-bold fs-5" th:text="${riga.punti}">0</td>
                            <td th:text="${riga.partiteGiocate}">0</td>
                            <td class="text-success fw-bold" th:text="${riga.vittorie}">0</td>
                            <td class="text-warning fw-bold" th:text="${riga.pareggi}">0</td>
                            <td class="text-danger fw-bold" th:text="${riga.sconfitte}">0</td>
                            <td th:text="${riga.golFatti}">0</td>
                            <td th:text="${riga.golSubiti}">0</td>
                            <td th:text="${riga.differenzaReti}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:unless="${classifica != null and !classifica.isEmpty()}" class="card-body text-center py-5">
                <p class="text-muted mb-0">Nessuna squadra iscritta o classifica non disponibile.</p>
            </div>
        </div>
    </div>
</body>
</html>
