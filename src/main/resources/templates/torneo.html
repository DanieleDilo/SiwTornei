<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettaglio Torneo - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container" th:if="${torneo != null}">
        <a th:href="@{/torneo}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna ai Tornei
        </a>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h3 class="text-primary fw-bold" th:text="${torneo.nome}">Nome Torneo</h3>
                        <p class="text-muted"><i class="bi bi-calendar"></i> Edizione: <span th:text="${torneo.anno}">2024</span></p>
                        <hr>
                        
                        <div class="d-grid gap-2 mt-3" sec:authorize="hasAuthority('ADMIN')">
                            <a th:href="@{'/admin/torneo/' + ${torneo.id} + '/squadre'}" class="btn btn-warning">
                                 <i class="bi bi-pencil-square"></i> Gestisci Iscrizioni
                            </a>
                            <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/delete'}" method="POST" 
                                  onsubmit="return confirm('Sei sicuro di voler eliminare definitivamente questo torneo?');">
                                <button type="submit" class="btn btn-danger w-100">
                                    <i class="bi bi-trash3-fill"></i> Elimina Torneo
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white p-3">
                        <h4 class="mb-0 fw-bold text-success"><i class="bi bi-list-ol"></i> Classifica del Torneo</h4>
                    </div>
                    
                    <div class="table-responsive" th:if="${classifica != null and !classifica.isEmpty()}">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th class="text-start">Squadra</th>
                                    <th>Pt</th>
                                    <th>G</th>
                                    <th>V</th>
                                    <th>P</th>
                                    <th>S</th>
                                    <th>GF</th>
                                    <th>GS</th>
                                    <th>DR</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="riga, iterStat : ${classifica}">
                                    <td class="fw-bold text-muted" th:text="${iterStat.count}">1</td>
                                    <td class="text-start fw-bold text-primary">
                                        <a th:href="@{'/squadra/' + ${riga.squadra.id}(from='torneo', refId=${torneo.id})}" class="text-decoration-none" th:text="${riga.squadra.nome}">Nome</a>
                                    </td>
                                    <td class="fw-bold fs-5" th:text="${riga.punti}">0</td>
                                    <td th:text="${riga.partiteGiocate}">0</td>
                                    <td class="text-success fw-bold" th:text="${riga.vittorie}">0</td>
                                    <td class="text-warning fw-bold" th:text="${riga.pareggi}">0</td>
                                    <td class="text-danger fw-bold" th:text="${riga.sconfitte}">0</td>
                                    <td th:text="${riga.golFatti}">0</td>
                                    <td th:text="${riga.golSubiti}">0</td>
                                    <td th:text="${riga.differenzaReti}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:unless="${classifica != null and !classifica.isEmpty()}" class="card-body text-center py-5">
                        <p class="text-muted mb-0">Nessuna squadra iscritta o classifica non disponibile.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
