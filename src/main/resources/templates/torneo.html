<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dettaglio Torneo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h3 class="text-primary fw-bold" th:text="${torneo.nome}">Nome Torneo</h3>
                        <p class="text-muted"><i class="bi bi-calendar"></i> Edizione: <span th:text="${torneo.anno}">2024</span></p>
                        <hr>
                        <a th:href="@{'/admin/torneo/' + ${torneo.id} + '/squadre'}" class="btn btn-warning w-100">
                             <i class="bi bi-pencil-square"></i> Gestisci Iscrizioni (Admin)
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white p-3">
                        <h4 class="mb-0 fw-bold text-success"><i class="bi bi-shield-check"></i> Squadre Partecipanti</h4>
                    </div>
                    <ul class="list-group list-group-flush" th:if="${torneo.squadre != null and !torneo.squadre.isEmpty()}">
                        <li class="list-group-item d-flex justify-content-between align-items-center p-3" th:each="s : ${torneo.squadre}">
                            <div>
                                <span class="fw-bold" th:text="${s.nome}">Nome</span>
                                <small class="text-muted ms-2" th:text="${s.citta}">Città</small>
                            </div>
                            <a th:href="@{'/squadra/' + ${s.id}}" class="btn btn-sm btn-light">Profilo</a>
                        </li>
                    </ul>
                    <div th:unless="${torneo.squadre != null and !torneo.squadre.isEmpty()}" class="card-body text-center py-5">
                        <p class="text-muted mb-0">Ancora nessuna squadra iscritta.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
