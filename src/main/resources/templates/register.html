<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container" style="max-width: 450px;">
        <a th:href="@{/login}" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left"></i> Torna al Login</a>
        
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-5 text-success"></i>
                    <h3 class="fw-bold text-dark mt-2">Crea un Account</h3>
                    <p class="text-muted small">Registrati per poter commentare le partite dei tornei</p>
                </div>


                <div th:if="${error}" class="alert alert-danger shadow-sm small" th:text="${error}">
                    Errore durante la registrazione.
                </div>

                <form th:action="@{/register}" method="POST">

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Nome</label>
                            <input type="text" class="form-control" name="nome"
                                   th:value="${nome}" placeholder="Es: Mario" required />
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Cognome</label>
                            <input type="text" class="form-control" name="cognome"
                                   th:value="${cognome}" placeholder="Es: Rossi" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email</label>
                        <input type="email" class="form-control" name="email"
                               th:value="${email}" placeholder="Es: mario.rossi@email.com" required />
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Password</label>
                        <input type="password" class="form-control" name="password"
                               placeholder="Min. 8 caratteri, 1 maiuscola, 1 numero" required minlength="8" />
                        <div class="form-text">Almeno 8 caratteri, una lettera maiuscola e un numero.</div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Completa Registrazione</button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <p class="mb-0 text-muted small">Hai già un account? 
                        <a th:href="@{/login}" class="fw-bold text-success text-decoration-none">Accedi qui</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
