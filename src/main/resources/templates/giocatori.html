<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elenco Giocatori - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <a th:href="@{/}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna alla Home
        </a>

        <div class="row g-4">
            <!-- Sidebar Panel: Search & Controls -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px; z-index: 10;">
                    <div class="card-body p-4">
                        <h4 class="fw-bold text-white mb-3"><i class="bi bi-funnel-fill"></i> Filtra Giocatori</h4>
                        
                        <form th:action="@{/giocatori}" method="get" class="mb-2">
                            <div class="mb-3">
                                <label class="form-label">Nome o Cognome</label>
                                <input type="text" name="ricerca" class="form-control" placeholder="Cerca per nome o cognome..."
                                    th:value="${ricerca}">
                            </div>
                            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Cerca</button>
                        </form>

                        <div sec:authorize="hasAuthority('ADMIN')" class="border-top pt-4 mt-3">
                            <h5 class="fw-bold text-warning mb-3"><i class="bi bi-gear-fill"></i> Azioni Admin</h5>
                            <a th:href="@{/admin/formNewGiocatore}" class="btn btn-success w-100 shadow-sm">
                                <i class="bi bi-person-plus-fill"></i> Nuovo Giocatore
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content Area: Players Grid -->
            <div class="col-lg-8">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h2 class="fw-bold text-warning mb-0"><i class="bi bi-people-fill"></i> Giocatori Registrati</h2>
                </div>

                <div class="row g-4" th:if="${giocatori != null and !giocatori.isEmpty()}">
                    <div class="col-md-6 col-lg-4" th:each="giocatore : ${giocatori}">
                        <div class="card h-100 shadow-sm border-0 transition-hover">
                            <div class="card-body d-flex flex-column justify-content-between p-4">
                                <div>
                                    <div class="d-flex align-items-start justify-content-between mb-3">
                                        <div class="p-2 bg-primary bg-opacity-10 text-primary rounded-3">
                                            <i class="bi bi-person-badge fs-3"></i>
                                        </div>
                                        <span class="badge bg-secondary px-3 py-2 fs-7" th:text="${giocatore.ruolo}">Ruolo</span>
                                    </div>
                                    <h5 class="fw-bold text-white mb-2" th:text="${giocatore.nome} + ' ' + ${giocatore.cognome}">Nome Cognome</h5>
                                    
                                    <p class="text-muted small mb-1">
                                        <i class="bi bi-calendar-event"></i> Nascita: <span th:text="${giocatore.dataNascita}">Data</span>
                                    </p>
                                    <p class="text-muted small mb-1" th:if="${giocatore.altezza != null}">
                                        <i class="bi bi-ruler"></i> Altezza: <span th:text="${giocatore.altezza} + ' m'">1.80 m</span>
                                    </p>
                                    <p class="text-muted small mb-0">
                                        <i class="bi bi-shield-shaded"></i> Squadra: 
                                        <span th:if="${giocatore.squadra != null}">
                                            <a th:href="@{'/squadra/' + ${giocatore.squadra.id}(from='giocatori')}" 
                                               th:text="${giocatore.squadra.nome}" 
                                               class="text-decoration-none fw-bold text-success">Nome Squadra</a>
                                        </span>
                                        <span th:unless="${giocatore.squadra != null}" class="text-muted italic">Svincolato</span>
                                    </p>
                                </div>
                                
                                <!-- Admin Actions on specific players if logged in as admin -->
                                <div sec:authorize="hasAuthority('ADMIN')" class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                    <a th:href="@{'/admin/giocatore/' + ${giocatore.id} + '/edit'}" class="btn btn-sm btn-outline-primary px-3">
                                        <i class="bi bi-pencil-fill"></i> Modifica
                                    </a>
                                    <form th:action="@{'/admin/giocatore/' + ${giocatore.id} + '/delete'}" method="POST" 
                                          onsubmit="return confirm('Eliminare questo giocatore?');" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-danger px-3">
                                            <i class="bi bi-person-x-fill"></i> Rimuovi
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:unless="${giocatori != null and !giocatori.isEmpty()}" class="alert alert-info shadow-sm mt-2">
                    <i class="bi bi-info-circle"></i> Nessun giocatore trovato corrispondente ai criteri di ricerca.
                </div>
            </div>
        </div>

    </div>
</body>

</html>
