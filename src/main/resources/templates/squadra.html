<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettaglio Squadra - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container" th:if="${squadra != null}">
        <th:block th:if="${from == 'torneo'}">
            <a th:href="@{'/torneo/' + ${refId}}" class="btn btn-outline-secondary mb-4 shadow-sm">
                <i class="bi bi-arrow-left"></i> Torna al Torneo
            </a>
        </th:block>
        
        <th:block th:if="${from == 'giocatori'}">
            <a th:href="@{/giocatori}" class="btn btn-outline-secondary mb-4 shadow-sm">
                <i class="bi bi-arrow-left"></i> Torna all'Elenco Giocatori
            </a>
        </th:block>
        
        <th:block th:unless="${from == 'torneo' or from == 'giocatori'}">
            <a th:href="@{/squadra}" class="btn btn-outline-secondary mb-4 shadow-sm">
                <i class="bi bi-arrow-left"></i> Torna alla Ricerca Squadre
            </a>
        </th:block>

        <!-- Full width Team Header Banner -->
        <div class="card bg-success text-white mb-4 shadow-sm border-0">
            <div class="card-body p-4 p-md-5 d-flex flex-column flex-md-row align-items-center justify-content-between gap-4">
                <div class="d-flex align-items-center gap-4 text-center text-md-start flex-column flex-md-row">
                    <div class="team-shield-wrapper p-3 bg-white bg-opacity-10 rounded-circle">
                        <i class="bi bi-shield-fill display-2 text-white"></i>
                    </div>
                    <div>
                        <h1 class="fw-bold mb-1 display-4" th:text="${squadra.nome}">Nome</h1>
                        <p class="mb-0 fs-5 opacity-90"><i class="bi bi-geo-alt-fill"></i> <span th:text="${squadra.citta}">Città</span> &nbsp;|&nbsp; <i class="bi bi-calendar-check"></i> Dal <span th:text="${squadra.annoFondazione}">1900</span></p>
                    </div>
                </div>
                
                <!-- Admin Operations inline button bar -->
                <div sec:authorize="hasAuthority('ADMIN')" class="d-flex flex-wrap gap-2 justify-content-center">
                    <a th:href="@{'/admin/squadra/' + ${squadra.id} + '/edit'}" class="btn btn-warning px-4 py-2">
                        <i class="bi bi-pencil-square"></i> Modifica Squadra
                    </a>
                    <a th:href="@{'/admin/squadra/' + ${squadra.id} + '/formNewGiocatore'}" class="btn btn-dark px-4 py-2">
                        <i class="bi bi-person-plus"></i> Aggiungi Giocatore
                    </a>
                    <form th:action="@{'/admin/squadra/' + ${squadra.id} + '/delete'}" method="POST" 
                          onsubmit="return confirm('Vuoi davvero eliminare questa Squadra?');" class="m-0">
                        <button type="submit" class="btn btn-danger px-4 py-2">
                            <i class="bi bi-trash3"></i> Elimina
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Players List section - Grids of personal cards -->
        <div class="mt-5">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h3 class="fw-bold text-primary mb-0"><i class="bi bi-people-fill"></i> Rosa Giocatori</h3>
            </div>
            
            <div th:if="${squadra.giocatori != null and !squadra.giocatori.isEmpty()}" class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="giocatore : ${squadra.giocatori}">
                    <div class="card h-100 transition-hover border-0 shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-between p-4">
                            <div>
                                <div class="d-flex align-items-start justify-content-between mb-3">
                                    <div class="p-2 bg-primary bg-opacity-10 text-primary rounded-3">
                                        <i class="bi bi-person-badge fs-3"></i>
                                    </div>
                                    <span class="badge bg-secondary px-3 py-2 fs-7" th:text="${giocatore.ruolo}">Ruolo</span>
                                </div>
                                <h5 class="fw-bold text-white mb-2" th:text="${giocatore.nome} + ' ' + ${giocatore.cognome}">Nome</h5>
                                <p class="text-muted small mb-0"><i class="bi bi-calendar-event"></i> Nascita: <span th:text="${giocatore.dataNascita}">Data</span></p>
                            </div>
                            
                            <!-- Admin Actions on specific players -->
                            <div sec:authorize="hasAuthority('ADMIN')" class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                <a th:href="@{'/admin/giocatore/' + ${giocatore.id} + '/edit'}" class="btn btn-sm btn-outline-primary px-3">
                                    <i class="bi bi-pencil-fill"></i> Modifica
                                </a>
                                <form th:action="@{'/admin/giocatore/' + ${giocatore.id} + '/delete'}" method="POST" 
                                      onsubmit="return confirm('Eliminare questo giocatore?');" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-danger px-3">
                                        <i class="bi bi-person-x-fill"></i> Rimuovi
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:unless="${squadra.giocatori != null and !squadra.giocatori.isEmpty()}" class="card border-0 shadow-sm p-5 text-center">
                <i class="bi bi-people text-muted display-1 mb-3"></i>
                <p class="text-muted mb-0 fs-5">Nessun giocatore registrato in questa squadra.</p>
            </div>
        </div>
    </div>
</body>
</html>
