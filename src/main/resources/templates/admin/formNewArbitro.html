<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Arbitro - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container">
        <a th:href="@{/admin/index}" class="btn btn-link text-decoration-none mb-3 p-0">
            <i class="bi bi-arrow-left"></i> Annulla e Torna alla Dashboard
        </a>
        
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-vcard display-5 text-secondary"></i>
                    <h3 class="fw-bold text-dark mt-2">Registra Nuovo Arbitro</h3>
                    <p class="text-muted small">Inserisci i dati ufficiali del direttore di gara</p>
                </div>
                
                <form th:action="@{/admin/arbitro}" method="POST" th:object="${arbitro}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome}" placeholder="Es: Pierluigi" required />
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cognome</label>
                        <input type="text" class="form-control" th:field="*{cognome}" placeholder="Es: Collina" required />
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Codice Arbitrale ufficiale</label>
                        <input type="text" class="form-control" th:field="*{codiceArbitrale}" placeholder="Es: AIA-12345" required />
                    </div>
                    
                    <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-check-circle"></i> Salva Arbitro
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
