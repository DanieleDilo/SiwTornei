<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestisci Iscrizioni - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-outline-secondary mb-4 shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna al Torneo
        </a>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h3 class="fw-bold text-dark"><i class="bi bi-card-checklist text-warning"></i> Gestione Iscrizioni: <span class="text-primary" th:text="${torneo.nome}">Torneo</span></h3>
                <hr>

                <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/addSquadra'}" method="POST" class="row g-3 align-items-end mb-4">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Iscrivi una nuova squadra</label>
                        <select name="squadraId" class="form-select" required>
                            <option value="" selected disabled>-- Seleziona una squadra dal database --</option>
                            <option th:each="s : ${squadreDisponibili}" th:value="${s.id}" th:text="${s.nome} + ' (' + ${s.citta} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-success w-100 fw-bold"><i class="bi bi-plus-circle"></i> Iscrivi Squadra</button>
                    </div>
                </form>

                <h5 class="fw-bold mt-4 mb-3">Squadre Attualmente Iscritte</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome Squadra</th>
                                <th>Città</th>
                                <th class="text-end">Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="squadra : ${torneo.squadre}">
                                <td class="fw-bold" th:text="${squadra.nome}">Nome</td>
                                <td th:text="${squadra.citta}">Città</td>
                                <td class="text-end">
                                    <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/removeSquadra/' + ${squadra.id}}" method="POST" class="m-0"
                                          onsubmit="return confirm('Rimuovere questa squadra dal torneo?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm">
                                            <i class="bi bi-x-circle-fill"></i> Rimuovi
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${torneo.squadre.isEmpty()}">
                                <td colspan="3" class="text-center py-4 text-muted">Nessuna squadra iscritta a questo torneo.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
