<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Iscrizioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-0 mb-4">
            <div class="card-header bg-primary text-white p-3"><h3 class="mb-0">Gestione Iscrizioni: <span class="fw-bold" th:text="${torneo.nome}">Torneo</span></h3></div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-success text-white"><i class="bi bi-check-circle"></i> Squadre Già Iscritte</div>
                    <ul class="list-group list-group-flush" th:if="${torneo.squadre != null and !torneo.squadre.isEmpty()}">
                        <li class="list-group-item" th:each="s : ${torneo.squadre}"><strong th:text="${s.nome}">Nome</strong> (<span th:text="${s.citta}">Città</span>)</li>
                    </ul>
                    <div th:unless="${torneo.squadre != null and !torneo.squadre.isEmpty()}" class="card-body text-center"><p class="text-muted">Nessuna squadra iscritta.</p></div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-warning text-dark"><i class="bi bi-list-task"></i> Squadre Disponibili</div>
                    <ul class="list-group list-group-flush" th:if="${squadreDisponibili != null and !squadreDisponibili.isEmpty()}">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="squadra : ${squadreDisponibili}">
                            <span th:text="${squadra.nome}">Nome</span>
                            <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/squadra/' + ${squadra.id}}" method="POST" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-plus-lg"></i> Iscrivi</button>
                            </form>
                        </li>
                    </ul>
                    <div th:unless="${squadreDisponibili != null and !squadreDisponibili.isEmpty()}" class="card-body text-center"><p class="text-muted">Tutte le squadre sono già iscritte.</p></div>
                </div>
            </div>
        </div>
        <div class="mt-4"><a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Torna al Torneo</a></div>
    </div>
</body>
</html>
