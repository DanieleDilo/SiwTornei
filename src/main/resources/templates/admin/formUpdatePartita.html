<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna Risultato - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container">
        <a th:href="@{/partite}" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left"></i> Annulla e Torna al Calendario</a>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h3 class="fw-bold text-dark mb-4"><i class="bi bi-stopwatch"></i> Aggiorna Risultato</h3>
                
                <div th:if="${errore}" class="alert alert-danger small mb-3" th:text="${errore}">Errore</div>

                <p class="text-muted small mb-4" th:text="${partita.torneo.nome}">Nome Torneo</p>

                <form th:action="@{'/admin/partita/' + ${partita.id} + '/risultato'}" method="POST" th:object="${partita}">
                    
                    <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
                        <div class="w-50 text-end">
                            <h5 class="fw-bold mb-2" th:text="${partita.squadraCasa.nome}">Casa</h5>
                            <input type="number" min="0" class="form-control form-control-lg text-center mx-auto shadow-sm" style="max-width: 80px;" th:classappend="${#fields.hasErrors('goalsHome')} ? 'is-invalid'" th:field="*{goalsHome}" />
                            <div class="invalid-feedback text-center" th:if="${#fields.hasErrors('goalsHome')}" th:errors="*{goalsHome}">Errore</div>
                        </div>
                        
                        <div class="fs-4 text-muted fw-bold">-</div>
                        
                        <div class="w-50 text-start">
                            <h5 class="fw-bold mb-2" th:text="${partita.squadraTrasferta.nome}">Trasferta</h5>
                            <input type="number" min="0" class="form-control form-control-lg text-center mx-auto shadow-sm" style="max-width: 80px;" th:classappend="${#fields.hasErrors('goalsAway')} ? 'is-invalid'" th:field="*{goalsAway}" />
                            <div class="invalid-feedback text-center" th:if="${#fields.hasErrors('goalsAway')}" th:errors="*{goalsAway}">Errore</div>
                        </div>
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label fw-semibold">Stato Partita</label>
                        <select class="form-select" th:field="*{stato}">
                            <option value="SCHEDULED">In Programma (Azzera risultato)</option>
                            <option value="PLAYED">Giocata (Conferma risultato)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Salva Risultato</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
