<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna Risultato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-0 mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white p-3 text-center"><h3 class="mb-0">Inserisci Risultato</h3></div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-1" th:text="${partita.torneo.nome}">Torneo</p>
                <h5 class="fw-bold mb-4"><span th:text="${partita.squadraCasa.nome}">Casa</span> VS <span th:text="${partita.squadraTrasferta.nome}">Trasferta</span></h5>
                
                <form th:action="@{'/admin/partita/' + ${partita.id} + '/risultato'}" th:object="${partita}" method="POST">
                    <div class="row mb-4">
                        <div class="col-6">
                            <label class="form-label fw-bold text-danger">Gol Casa</label>
                            <input type="number" min="0" class="form-control text-center fs-3" th:field="*{goalsHome}" required />
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold text-primary">Gol Trasferta</label>
                            <input type="number" min="0" class="form-control text-center fs-3" th:field="*{goalsAway}" required />
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Salva Risultato Definitivo</button>
                        <a th:href="@{/partite}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
