<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi Giocatore - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container">
        <a th:href="@{'/squadra/' + ${squadra.id}}" class="btn btn-link text-decoration-none mb-3 p-0">
            <i class="bi bi-arrow-left"></i> Annulla e Torna alla Squadra
        </a>
        
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-dark mb-2"><i class="bi bi-person-plus-fill"></i> Tesseramento</h3>
                <p class="text-muted small mb-4">Stai aggiungendo un atleta alla squadra: <strong th:text="${squadra.nome}">Club</strong></p>
                
                <form th:action="@{'/admin/squadra/' + ${squadra.id} + '/giocatore'}" method="POST" th:object="${giocatore}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" th:field="*{nome}" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Errore</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cognome</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('cognome')} ? 'is-invalid'" th:field="*{cognome}" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}">Errore</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ruolo Tecnico</label>
                        <select class="form-select" th:classappend="${#fields.hasErrors('ruolo')} ? 'is-invalid'" th:field="*{ruolo}">
                            <option value="PORTIERE">Portiere</option>
                            <option value="DIFENSORE">Difensore</option>
                            <option value="CENTROCAMPISTA">Centrocampista</option>
                            <option value="ATTACCANTE">Attaccante</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}">Errore</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Altezza (m)</label>
                        <input type="number" step="0.01" class="form-control" th:classappend="${#fields.hasErrors('altezza')} ? 'is-invalid'" th:field="*{altezza}" placeholder="Es: 1.85" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}">Errore</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Data di Nascita</label>
                        <input type="date" class="form-control" th:classappend="${#fields.hasErrors('dataNascita')} ? 'is-invalid'" th:field="*{dataNascita}" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascita')}" th:errors="*{dataNascita}">Errore</div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Completa Iscrizione</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
