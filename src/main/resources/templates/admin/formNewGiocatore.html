<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Giocatore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white p-3 text-center">
                        <h4 class="mb-0">Aggiungi Giocatore a: <span class="text-warning" th:text="${squadra.nome}">Squadra</span></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{'/admin/squadra/' + ${squadra.id} + '/giocatore'}" th:object="${giocatore}" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label fw-bold">Nome</label><input type="text" class="form-control" th:field="*{nome}" required /></div>
                                <div class="col-md-6 mb-3"><label class="form-label fw-bold">Cognome</label><input type="text" class="form-control" th:field="*{cognome}" required /></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Data di Nascita</label><input type="date" class="form-control" th:field="*{dataNascita}" required />
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Ruolo</label>
                                    <select class="form-select" th:field="*{ruolo}">
                                        <option value="Portiere">Portiere</option>
                                        <option value="Difensore">Difensore</option>
                                        <option value="Centrocampista">Centrocampista</option>
                                        <option value="Attaccante">Attaccante</option>
                                    </select>
                                </div>
                                <div class="col-md-6"><label class="form-label fw-bold">Altezza (m)</label><input type="number" step="0.01" class="form-control" th:field="*{altezza}" required /></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Salva Giocatore</button>
                                <a th:href="@{'/squadra/' + ${squadra.id}}" class="btn btn-outline-secondary">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
