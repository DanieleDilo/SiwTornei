<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pianifica Partita - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container" style="max-width: 550px;">
        <a th:href="@{/admin/index}" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left"></i> Annulla e Torna</a>
        
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-danger mb-4"><i class="bi bi-calendar-plus"></i> Pianifica Nuova Partita</h3>
                
                <form th:action="@{/admin/partita}" method="POST" th:object="${partita}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleziona Torneo Competizione</label>
                        <select class="form-select" th:field="*{torneo}">
                            <option th:each="t : ${tornei}" th:value="${t.id}" th:text="${t.nome} + ' (' + ${t.anno} + ')'"></option>
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Squadra in Casa</label>
                            <select class="form-select" th:field="*{squadraCasa}">
                                <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Squadra in Trasferta</label>
                            <select class="form-select" th:field="*{squadraTrasferta}">
                                <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Data e Ora Calcio d'Inizio</label>
                        <input type="datetime-local" class="form-control" th:field="*{dataOra}" required />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Stadio / Luogo dell'Incontro</label>
                        <input type="text" class="form-control" th:field="*{luogo}" placeholder="Es: Stadio Olimpico" required />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Arbitro dell'Incontro</label>
                        <select class="form-select" th:field="*{arbitro}" required>
                            <option value="" disabled selected>-- Seleziona un Arbitro --</option>
                            <option th:each="a : ${arbitri}" th:value="${a.id}" th:text="${a.nome} + ' ' + ${a.cognome}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Aggiungi a Calendario</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
