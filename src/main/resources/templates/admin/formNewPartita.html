<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Programma Nuova Partita</title>
</head>
<body>
    <h1>Pianifica una Partita</h1>
    
    <form th:action="@{/admin/partita}" th:object="${partita}" method="POST">
        
        <div>
            <label>Torneo:</label>
            <select th:field="*{torneo}" required>
                <option value="">-- Seleziona un Torneo --</option>
                <option th:each="t : ${tornei}" th:value="${t.id}" th:text="${t.nome}"></option>
            </select>
        </div>

        <div>
            <label>Squadra in Casa:</label>
            <select th:field="*{squadraCasa}" required>
                <option value="">-- Seleziona Squadra Casa --</option>
                <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
            </select>
        </div>

        <div>
            <label>Squadra in Trasferta:</label>
            <select th:field="*{squadraTrasferta}" required>
                <option value="">-- Seleziona Squadra Trasferta --</option>
                <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
            </select>
        </div>

        <div>
            <label>Arbitro:</label>
            <select th:field="*{arbitro}" required>
                <option value="">-- Seleziona Arbitro --</option>
                <option th:each="a : ${arbitri}" th:value="${a.id}" th:text="${a.nome} + ' ' + ${a.cognome}"></option>
            </select>
        </div>

        <div>
            <label>Data e Ora:</label>
            <input type="datetime-local" th:field="*{dataOra}" required />
        </div>
        
        <div>
            <label>Luogo (Stadio):</label>
            <input type="text" th:field="*{luogo}" required />
        </div>

        <div style="margin-top: 20px;">
            <button type="submit">Programma Partita</button>
        </div>
    </form>
    
    <hr>
    <a th:href="@{/admin/index}">Torna al Pannello Admin</a>
</body>
</html>
