<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nuova Squadra - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container login-container">
        <a th:href="@{/admin/index}" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left"></i> Annulla e Torna</a>
        
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-success mb-4"><i class="bi bi-shield-plus"></i> Registra Squadra</h3>
                
                <form th:action="@{/admin/squadra}" method="POST" th:object="${squadra}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome Club</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" th:field="*{nome}" placeholder="Es: F.C. Roma Tre" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Errore</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Città</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('citta')} ? 'is-invalid'" th:field="*{citta}" placeholder="Es: Roma" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}">Errore</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Anno di Fondazione</label>
                        <input type="number" class="form-control" th:classappend="${#fields.hasErrors('annoFondazione')} ? 'is-invalid'" th:field="*{annoFondazione}" placeholder="Es: 2010" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('annoFondazione')}" th:errors="*{annoFondazione}">Errore</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Salva Squadra</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
