<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuova Squadra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white p-3 text-center"><h3 class="mb-0">Inserisci Nuova Squadra</h3></div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/squadra}" th:object="${squadra}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nome Squadra</label>
                                <input type="text" class="form-control" th:field="*{nome}" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Anno Fondazione</label>
                                <input type="number" class="form-control" th:field="*{annoFondazione}" required />
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Città</label>
                                <input type="text" class="form-control" th:field="*{citta}" required />
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Salva Squadra</button>
                                <a th:href="@{/admin/index}" class="btn btn-outline-secondary">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
