<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Elenco Squadre - SIW Tornei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-trophy-fill text-warning"></i> SIW Tornei</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white p-3">
                <h2 class="mb-0 text-success fw-bold"><i class="bi bi-shield-shaded"></i> Squadre Iscritte</h2>
            </div>
            <div class="card-body">
                <div class="row g-4" th:if="${squadre != null and !squadre.isEmpty()}">
                    <div class="col-md-4" th:each="squadra : ${squadre}">
                        <div class="card h-100 border-success border-opacity-25 shadow-sm">
                            <div class="card-body text-center">
                                <h4 class="card-title fw-bold text-dark" th:text="${squadra.nome}">Nome</h4>
                                <p class="text-muted mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${squadra.citta}">Città</span></p>
                                <p class="text-muted"><i class="bi bi-calendar-star"></i> Fondazione: <span th:text="${squadra.annoFondazione}">Anno</span></p>
                                <a th:href="@{'/squadra/' + ${squadra.id}}" class="btn btn-outline-success w-100">Profilo Squadra</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:unless="${squadre != null and !squadre.isEmpty()}" class="text-center p-5">
                    <p class="text-muted">Nessuna squadra registrata al momento.</p>
                </div>
            </div>
        </div>
        <div class="mt-3"><a th:href="@{/}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Torna alla Home</a></div>
    </div>
</body>
</html>
